name: Build RE5 Korean + Mod Installer NSP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - uses: actions/checkout@v4

      - name: Download complete RE5 romfs from latest GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/download_romfs_release.py

      - name: Preflight source and complete ROMFS
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/preflight.py
          test -f source/main.c
          grep -nE '\bint[[:space:]]+main[[:space:]]*\(' source/main.c

      - name: Restore prod.keys from repository secret
        shell: bash
        env:
          PROD_KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
        run: |
          set -euo pipefail
          test -n "$PROD_KEYS_B64" || { echo 'Missing secret PROD_KEYS_B64'; exit 2; }
          printf '%s' "$PROD_KEYS_B64" | base64 -d > /tmp/prod.keys
          test -s /tmp/prod.keys
          chmod 600 /tmp/prod.keys

      - name: Build RE5 Korean + character mod installer NSP
        shell: bash
        run: |
          set -euo pipefail
          PROD_KEYS=/tmp/prod.keys bash ./tools/build_installer_nsp.sh

      - name: Verify installer NSP
        shell: bash
        run: |
          set -euo pipefail
          test -s RE5_Korean_Mod_Installer.nsp
          python3 - <<'PY'
          from pathlib import Path
          p = Path("RE5_Korean_Mod_Installer.nsp")
          assert p.read_bytes()[:4] == b"PFS0", "installer NSP is not PFS0"
          print("Installer NSP PFS0 OK:", p.stat().st_size)
          PY
          sha256sum RE5_Korean_Mod_Installer.nsp > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload installer result
        uses: actions/upload-artifact@v4
        with:
          name: RE5-v17-Korean-Mod-Installer-FINAL
          if-no-files-found: error
          path: |
            RE5_Korean_Mod_Installer.nsp
            SHA256SUMS.txt
