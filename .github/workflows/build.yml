name: Build RE5 Korean Patch Installer v12.2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      TITLEID: "0500000000000001"
    steps:
      - uses: actions/checkout@v4

      - name: Restore prod.keys safely
        shell: bash
        env:
          PROD_KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
        run: |
          set -euo pipefail
          test -n "$PROD_KEYS_B64"
          printf '%s' "$PROD_KEYS_B64" | base64 -d > /tmp/prod.keys
          chmod 600 /tmp/prod.keys

      - name: Static preflight - photos and Korean patch must be present
        run: python3 tools/preflight.py

      - name: Verify fixed Installer Title ID
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TITLEID" <<'PY'
          import json,sys
          tid=sys.argv[1].upper()
          j=json.load(open('npdm.json',encoding='utf-8'))
          expected='0x'+tid
          assert j['title_id'].lower()==expected.lower()
          assert j['title_id_range_min'].lower()==expected.lower()
          assert j['title_id_range_max'].lower()==expected.lower()
          print('Using fixed Installer Title ID:',tid)
          PY

      - name: Build application ELF/NSO/NPDM/NACP
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"

          # Hard fail if the host x86 linker/compiler would be used.
          command -v aarch64-none-elf-gcc
          command -v aarch64-none-elf-ld
          aarch64-none-elf-gcc --version | head -1
          aarch64-none-elf-ld --version | head -1

          make clean || true
          make -j2 CC="$DEVKITA64/bin/aarch64-none-elf-gcc" CXX="$DEVKITA64/bin/aarch64-none-elf-g++" LD="$DEVKITA64/bin/aarch64-none-elf-g++" AR="$DEVKITA64/bin/aarch64-none-elf-gcc-ar" OBJCOPY="$DEVKITA64/bin/aarch64-none-elf-objcopy" STRIP="$DEVKITA64/bin/aarch64-none-elf-strip"
          mkdir -p exefs
          elf2nso RE5_Korean_Patch_Installer.elf exefs/main
          npdmtool npdm.json exefs/main.npdm
          nacptool --create "RE5 Korean Patch Installer" "RE5 Korean Patch Project" "12.3.0" control/control.nacp --titleid="$TITLEID"
          test -s exefs/main
          test -s exefs/main.npdm
          test -s control/control.nacp

      - name: Build hacBrewPack
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/pplatoon/hacBrewPack.git hacBrewPack-src
          make -C hacBrewPack-src -j2

      - name: Pack NSP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf hacbrewpack_nca hacbrewpack_nsp hacbrewpack_temp
          ./hacBrewPack-src/hacbrewpack --keyset /tmp/prod.keys --titleid "$TITLEID" --exefsdir exefs --romfsdir romfs --controldir control --nologo
          NSP="$(find hacbrewpack_nsp -type f -name '*.nsp' | head -1)"
          test -n "$NSP"
          cp "$NSP" RE5_Korean_Patch_Installer_v12_3.nsp

      - name: Verify actual built NSP includes manual image payload
        run: python3 tools/verify_nsp.py RE5_Korean_Patch_Installer_v12_3.nsp

      - name: Output hashes
        shell: bash
        run: |
          sha256sum RE5_Korean_Patch_Installer_v12_3.nsp > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RE5_Korean_Patch_Installer_v12_3_VERIFIED
          path: |
            RE5_Korean_Patch_Installer_v12_3.nsp
            SHA256SUMS.txt
