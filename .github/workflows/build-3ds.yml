name: Build Bermuda Syndrome 3DS

on:
  workflow_dispatch:
  push:
    branches: [ bermuda-3ds ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 3DSX
        shell: bash
        run: |
          set -euxo pipefail
          make -f Makefile.3ds -j2 3dsx
          ls -la bermuda.3dsx

      - name: Get CIA tools
        id: tools
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee tools.log) 2>&1
          set -eux
          apt-get update && apt-get install -y --no-install-recommends unzip curl ca-certificates git
          mkdir -p /tmp/t && cd /tmp/t
          H="Authorization: Bearer $GH_TOKEN"
          curl -fsSL -H "$H" https://api.github.com/repos/3DSGuy/Project_CTR/releases > ctr.json
          grep -o '"browser_download_url": *"[^"]*"' ctr.json | head -20
          url=$(grep -o 'https://[^"]*makerom[^"]*[Uu]buntu[^"]*\.zip' ctr.json | head -1)
          [ -n "$url" ] || url=$(grep -o 'https://[^"]*makerom[^"]*linux[^"]*\.zip' ctr.json | head -1)
          curl -fsSL -o makerom.zip "$url"; unzip -o makerom.zip -d mk; find mk -type f
          install -m755 "$(find mk -name 'makerom*' -type f ! -name '*.zip' | head -1)" /usr/local/bin/makerom
          curl -fsSL -H "$H" https://api.github.com/repos/Steveice10/bannertool/releases > bt.json
          url=$(grep -o 'https://[^"]*bannertool[^"]*\.zip' bt.json | head -1)
          curl -fsSL -o bannertool.zip "$url"; unzip -o bannertool.zip -d bt; find bt -type f
          install -m755 "$(find bt -path '*linux*x86_64*' -name bannertool -type f | head -1)" /usr/local/bin/bannertool
          makerom -version 2>&1 | head -2 || true

      - name: Build CIA
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eux
          make -f Makefile.3ds MAKEROM=makerom BANNERTOOL=bannertool cia 2>&1 | tee cia_build.log
          ls -la bermuda.cia

      - name: Package
        shell: bash
        run: |
          set -eux
          mkdir -p dist/3ds/bermuda
          cp bermuda.3dsx 3ds/BT16.TBM 3ds/README_3DS_KO.txt 3ds/Galmuri_OFL_LICENSE.txt dist/3ds/bermuda/
          if [ -f bermuda.cia ]; then cp bermuda.cia dist/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: bermuda-3ds
          if-no-files-found: error
          path: dist/

      - name: Publish outputs to branch bermuda-3ds-out
        shell: bash
        run: |
          set -eux
          git config --global --add safe.directory '*'
          cp cia_build.log dist/ 2>/dev/null || true; cp /tmp/t/../tools.log dist/ 2>/dev/null || cp tools.log dist/ 2>/dev/null || true
          cd dist
          git init -q -b bermuda-3ds-out
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" bermuda-3ds-out
