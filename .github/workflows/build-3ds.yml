name: Build Bermuda Syndrome 3DS

on:
  workflow_dispatch:
  push:
    branches: [ bermuda-3ds ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 3DSX
        shell: bash
        run: |
          set -euxo pipefail
          make -f Makefile.3ds -j2 3dsx
          ls -la bermuda.3dsx

      - name: Get CIA tools
        id: tools
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee tools.log) 2>&1
          set -eu
          set +o pipefail
          apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip curl ca-certificates git >/dev/null
          mkdir -p /tmp/t && cd /tmp/t
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/3DSGuy/Project_CTR/releases > ctr.json
          url=$(grep -o 'https://[^"]*makerom[^"]*ubuntu_x86_64\.zip' ctr.json | head -1)
          echo "makerom: $url"
          curl -fsSL -o makerom.zip "$url"; unzip -o -q makerom.zip -d mk; find mk -type f
          install -m755 "$(find mk -type f -name 'makerom*' | head -1)" /usr/local/bin/makerom
          for repo in diasurgical/bannertool Epicpkmn11/bannertool carstene1ns/3ds-bannertool Steveice10/bannertool; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/$repo/releases > bt.json || continue
            url=$(grep -o 'https://[^"]*\.zip' bt.json | grep -i -E 'bannertool|linux' | head -1)
            echo "$repo -> $url"
            [ -n "$url" ] || continue
            rm -rf bt; curl -fsSL -o bannertool.zip "$url" || continue
            unzip -o -q bannertool.zip -d bt || continue
            find bt -type f
            f=$(find bt -type f -name bannertool | grep -i linux | grep -E 'x86_64|amd64|x64' | head -1)
            [ -n "$f" ] || f=$(find bt -type f -name bannertool | head -1)
            [ -n "$f" ] || continue
            install -m755 "$f" /usr/local/bin/bannertool && break
          done
          if ! command -v bannertool; then
            echo "building bannertool from source"
            apt-get install -y -qq --no-install-recommends build-essential >/dev/null
            for repo in diasurgical/bannertool Epicpkmn11/bannertool; do
              rm -rf src; git clone --recursive --depth 1 https://github.com/$repo src || continue
              (cd src && make -j2) && f=$(find src/output -type f -name bannertool | head -1) && install -m755 "$f" /usr/local/bin/bannertool && break
            done
          fi
          makerom -version 2>&1 | head -2 || true
          bannertool 2>&1 | head -2 || true

      - name: Build CIA
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eux
          make -f Makefile.3ds MAKEROM=makerom BANNERTOOL=bannertool cia 2>&1 | tee cia_build.log
          ls -la bermuda.cia

      - name: Package
        shell: bash
        run: |
          set -eux
          mkdir -p dist/3ds/bermuda
          cp bermuda.3dsx 3ds/BT16.TBM 3ds/README_3DS_KO.txt 3ds/Galmuri_OFL_LICENSE.txt dist/3ds/bermuda/
          if [ -f bermuda.cia ]; then cp bermuda.cia dist/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: bermuda-3ds
          if-no-files-found: error
          path: dist/

      - name: Publish outputs to branch bermuda-3ds-out
        shell: bash
        run: |
          set -eux
          git config --global --add safe.directory '*'
          cp cia_build.log dist/ 2>/dev/null || true; cp /tmp/t/../tools.log dist/ 2>/dev/null || cp tools.log dist/ 2>/dev/null || true
          cd dist
          git init -q -b bermuda-3ds-out
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" bermuda-3ds-out
